<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131011">
<meta name="apple-itunes-app" content="app-id=1421025002">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Verona">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Road to Verona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: one-column mobile app (sticky top bar, scrolling views, bottom tab bar).
     World: night session in an empty arena – warm charcoal, Rosso-Verona coral for actions,
     every session type carries its own validated color. Single dark theme by choice. */
  color-scheme: dark;
  --bg: #131011;
  --surface: #1c1819;
  --surface-2: #262021;
  --line: #3a3233;
  --text: #f5efea;
  --text-2: #cbc0ba;
  --text-3: #988c86;
  --accent: #ff8f73;
  --accent-ink: #2b0d06;
  --accent-soft: rgba(255, 143, 115, 0.14);
  /* Session types (categorical, validated order: z2, q, rec, h, k) */
  --t-z2: #3987e5;
  --t-q: #d95926;
  --t-rec: #199e70;
  --t-h: #c98500;
  --t-k: #9085e9;
  --t-race: #ff8f73;
  /* Status */
  --good: #0ca30c;
  --warn: #fab219;
  --crit: #d03b3b;
  /* Intensity ramp Z1 → Z5 (single hue) */
  --z1: #4a2f2a; --z2: #77392d; --z3: #b04a35; --z4: #e4684a; --z5: #ff9f84;
  --font-display: "Big Shoulders Display", "Archivo", "Arial Narrow", sans-serif;
  --font-body: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-lg: 18px; --r-md: 12px; --r-sm: 8px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100%;
  background: var(--bg); color: var(--text);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--text); }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num, .tnum { font-variant-numeric: tabular-nums; }
.disp { font-family: var(--font-display); font-weight: 800; letter-spacing: 0.01em; }
.cond { font-stretch: 75%; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.small { font-size: 13px; }
.xs { font-size: 12px; }
.eyebrow { font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-3); font-weight: 650; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(10px + var(--safe-top)) 16px 10px;
  background: rgba(19, 16, 17, 0.92);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark {
  display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px;
  background: var(--accent); color: var(--accent-ink);
  font-family: var(--font-display); font-weight: 900; font-size: 17px; letter-spacing: 0.02em;
}
.brand-txt { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
.brand-txt b { font-family: var(--font-display); font-weight: 800; font-size: 19px; letter-spacing: 0.03em; text-transform: uppercase; white-space: nowrap; }
.brand-txt span { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sync {
  display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px; border-radius: 999px;
  border: 1px solid var(--line); font-size: 12px; color: var(--text-2); white-space: nowrap;
}
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); display: inline-block; }
.sync[data-s="cloud"] i { background: var(--good); }
.sync[data-s="connecting"] i { background: var(--warn); }
.sync[data-s="readonly"] i, .sync[data-s="offline"] i { background: var(--warn); }

/* ---------- Views ---------- */
main { padding: 16px 16px calc(96px + var(--safe-bottom)); max-width: 720px; margin: 0 auto; }
.view { display: none; flex-direction: column; gap: 18px; }
.view.active { display: flex; }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; }
.section-h h2 { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: 0.02em; text-transform: uppercase; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }

/* ---------- Race bib hero ---------- */
.bib {
  position: relative; overflow: hidden;
  border-radius: var(--r-lg); border: 1px solid var(--line);
  background:
    radial-gradient(120% 90% at 100% 0%, rgba(255, 143, 115, 0.16), transparent 55%),
    linear-gradient(180deg, #2a2223, #1d1819);
  padding: 18px 18px 16px;
}
.bib .pin { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: var(--bg); box-shadow: inset 0 1px 2px rgba(0,0,0,.6); }
.bib .pin.tl { top: 10px; left: 10px; } .bib .pin.tr { top: 10px; right: 10px; }
.bib .pin.bl { bottom: 10px; left: 10px; } .bib .pin.br { bottom: 10px; right: 10px; }
.bib-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 0 8px; }
.bib-event { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-2); font-weight: 650; }
.bib-main { display: flex; align-items: flex-end; gap: 14px; padding: 6px 8px 0; }
.bib-num { font-family: var(--font-display); font-weight: 900; font-size: 96px; line-height: 0.82; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.bib-unit { font-family: var(--font-display); font-weight: 800; font-size: 22px; text-transform: uppercase; color: var(--accent); line-height: 1; padding-bottom: 6px; }
.bib-sub { color: var(--text-2); font-size: 13.5px; padding: 8px 8px 0; }
.bib-hello { font-size: 15px; color: var(--text); padding: 0 8px; }
.ring-wrap { display: grid; place-items: center; position: relative; width: 76px; height: 76px; flex: none; }
.ring-wrap svg { position: absolute; inset: 0; }
.ring-wrap b { font-family: var(--font-display); font-weight: 800; font-size: 22px; line-height: 1; }
.ring-wrap span { font-size: 10px; color: var(--text-3); letter-spacing: 0.08em; text-transform: uppercase; }
.ring-inner { display: flex; flex-direction: column; align-items: center; }

/* Phase strip */
.phase-strip { padding: 14px 8px 2px; }
.ph-grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 3px; }
.ph-seg { height: 9px; border-radius: 3px; background: #3c3435; position: relative; }
.ph-seg.done { background: #8d817c; }
.ph-seg.cur { background: var(--accent); box-shadow: 0 0 0 3px rgba(255, 143, 115, 0.25); }
.ph-seg.deload::after { content: ""; position: absolute; left: 50%; top: -5px; width: 3px; height: 3px; margin-left: -1.5px; border-radius: 50%; background: var(--t-rec); }
.ph-labels { display: grid; grid-template-columns: 4fr 4fr 3fr 2fr; gap: 3px; margin-top: 7px; }
.ph-labels span { font-size: 11px; color: var(--text-3); letter-spacing: 0.06em; text-transform: uppercase; border-top: 1px solid var(--line); padding-top: 4px; }
.ph-labels span.on { color: var(--text); border-color: var(--accent); }

/* Coach note */
.coach { border-left: 3px solid var(--accent); background: linear-gradient(90deg, var(--accent-soft), transparent 70%); border-radius: 0 var(--r-md) var(--r-md) 0; padding: 12px 14px; }
.coach b { display: block; margin-bottom: 2px; }

/* Week chips */
.wchips { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 2px 6px; margin: 0 -2px; scrollbar-width: none; }
.wchips::-webkit-scrollbar { display: none; }
.wchip {
  scroll-snap-align: start; flex: none; min-width: 66px;
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
}
.wchip b { font-family: var(--font-display); font-weight: 800; font-size: 18px; line-height: 1; }
.wchip span { font-size: 11px; color: var(--text-3); white-space: nowrap; }
.wchip .dots { display: flex; gap: 3px; margin-top: 3px; }
.wchip .dots i { width: 6px; height: 6px; border-radius: 50%; background: #4a4042; }
.wchip .dots i.on { background: var(--good); }
.wchip[aria-current="true"] { border-color: var(--accent); background: #2a1f1e; }
.wchip.today b { color: var(--accent); }

/* Week header */
.wk-head { display: flex; flex-direction: column; gap: 10px; }
.wk-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.wk-title h2 { font-family: var(--font-display); font-weight: 900; font-size: 32px; line-height: 1; text-transform: uppercase; letter-spacing: 0.01em; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--line); font-size: 12px; color: var(--text-2); white-space: nowrap; background: var(--surface);
}
.chip.accent { border-color: rgba(255, 143, 115, 0.5); color: var(--accent); }
.chip.good { border-color: rgba(12, 163, 12, 0.5); color: #6fd36f; }
.chip.warn { border-color: rgba(250, 178, 25, 0.55); color: #ffd27a; }
.chip svg { width: 13px; height: 13px; flex: none; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }

/* Load meter */
.load { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; font-size: 12px; color: var(--text-3); }
.load-bar { height: 8px; border-radius: 4px; background: #332b2c; overflow: hidden; display: flex; gap: 2px; }
.load-bar i { display: block; height: 100%; border-radius: 4px; }

/* Day list */
.days { display: flex; flex-direction: column; }
.day { display: grid; grid-template-columns: 50px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.day:first-child { border-top: 0; }
.dlabel { display: flex; flex-direction: column; align-items: flex-start; padding-top: 4px; }
.dlabel .dow { font-size: 11.5px; color: var(--text-3); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 650; }
.dlabel .dnum { font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.day.today .dnum { color: var(--accent); }
.day.today .dow { color: var(--accent); }
.dcol { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.rest { display: flex; align-items: center; gap: 8px; color: var(--text-3); font-size: 13.5px; padding: 9px 0; }
.rest svg { width: 16px; height: 16px; flex: none; }

.sess {
  --tc: var(--t-z2);
  position: relative; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px;
  width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
  padding: 11px 12px 11px 16px; transition: border-color .15s, background .15s;
}
.sess::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 4px; border-radius: 0 4px 4px 0; background: var(--tc); }
.sess:hover { border-color: #554a4b; }
.sess .s-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sess .s-type { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: var(--tc); }
.sess .s-title { font-weight: 650; font-size: 15.5px; line-height: 1.25; margin-top: 2px; }
.sess .s-meta { font-size: 13px; color: var(--text-2); margin-top: 3px; }
.sess .s-flag { font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px dashed rgba(250, 178, 25, 0.6); color: #ffd27a; }
.sess .s-flag.ok { border-style: solid; border-color: rgba(12, 163, 12, 0.6); color: #7fdc7f; }
.sess .s-flag.alt { border-style: solid; border-color: var(--line); color: var(--text-2); }
.sess.done { background: #1a1f1a; }
.sess.done .s-title { color: var(--text-2); }
.tick {
  width: 30px; height: 30px; border-radius: 50%; border: 2px solid #4d4344;
  display: grid; place-items: center; flex: none;
}
.tick svg { width: 16px; height: 16px; opacity: 0; }
.sess.done .tick { background: var(--good); border-color: var(--good); }
.sess.done .tick svg { opacity: 1; }
.t-z2 { --tc: var(--t-z2); } .t-q { --tc: var(--t-q); } .t-rec { --tc: var(--t-rec); }
.t-h { --tc: var(--t-h); } .t-k { --tc: var(--t-k); } .t-race { --tc: var(--t-race); }

/* Planner cards */
.plan-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 640px) { .plan-grid { grid-template-columns: 1fr 1fr; } }
.pcard { --tc: var(--t-k); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px; display: flex; flex-direction: column; gap: 10px; border-top: 3px solid var(--tc); }
.pcard h3 { font-size: 16px; font-weight: 700; }
.pcard .lead { font-size: 13.5px; color: var(--text-2); }
.status-row { display: flex; gap: 6px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { padding: 8px 11px; font-size: 13px; color: var(--text-2); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 0 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface-2); font-weight: 650; font-size: 14px;
  text-decoration: none; color: var(--text);
}
.btn:hover { border-color: #5a4e4f; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.small { min-height: 34px; padding: 0 11px; font-size: 13px; }
.btn.block { width: 100%; }
.btn svg { width: 16px; height: 16px; flex: none; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }

.daypick { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.daypick button { padding: 8px 0; border-radius: 9px; border: 1px solid var(--line); font-size: 13px; color: var(--text-2); background: var(--surface-2); }
.daypick button[aria-pressed="true"] { background: var(--tc, var(--accent)); color: #fff; border-color: transparent; font-weight: 700; }
.daypick button:disabled { opacity: .35; cursor: not-allowed; }

/* Course list */
.clist { display: flex; flex-direction: column; gap: 6px; }
.citem {
  display: grid; grid-template-columns: 54px 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left;
  padding: 10px 12px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface-2);
}
.citem .ct { font-family: var(--font-display); font-weight: 800; font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums; }
.citem .cd { font-size: 11px; color: var(--text-3); letter-spacing: 0.08em; text-transform: uppercase; }
.citem .cn { font-weight: 650; }
.citem .cm { font-size: 12.5px; color: var(--text-2); }
.citem[aria-pressed="true"] { border-color: var(--t-k); background: #241f33; }
.citem.rec .cn::after { content: "Empfohlen"; margin-left: 8px; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--t-k); border: 1px solid rgba(144, 133, 233, 0.5); border-radius: 999px; padding: 1px 6px; vertical-align: 2px; font-weight: 700; }
.conf { font-size: 11px; color: var(--text-3); }
.conf.low { color: #ffd27a; }

/* Sheet */
.sheet { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
.sheet[hidden] { display: none; }
.sheet-bg { position: absolute; inset: 0; background: rgba(5, 3, 4, 0.66); }
.sheet-panel {
  position: relative; width: min(720px, 100%); max-height: 90vh; max-height: 90dvh; overflow: auto; overscroll-behavior: contain;
  background: var(--surface); border: 1px solid var(--line); border-bottom: 0;
  border-radius: 22px 22px 0 0; padding: 10px 18px calc(22px + var(--safe-bottom));
  animation: up .22s ease-out;
}
@keyframes up { from { transform: translateY(24px); opacity: .4; } to { transform: none; opacity: 1; } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: #4b4143; margin: 4px auto 12px; }
.sheet-close { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); }
.sheet-close svg { width: 16px; height: 16px; }
.sh-type { font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 750; color: var(--tc); }
.sh-title { font-family: var(--font-display); font-weight: 900; font-size: 34px; line-height: 1; text-transform: uppercase; margin-top: 4px; padding-right: 40px; }
.sh-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.sh-sec { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
.sh-sec h4 { margin: 0; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-3); }
.blocks { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.blk { display: grid; grid-template-columns: 6px 1fr; }
.blk + .blk { border-top: 1px solid var(--line); }
.blk i { display: block; }
.blk div { padding: 10px 12px; }
.blk b { display: block; font-size: 14px; }
.blk span { font-size: 13.5px; color: var(--text-2); }
.blk em { font-style: normal; color: var(--text-3); font-size: 12px; margin-left: 6px; }
ul.tips { margin: 0; padding-left: 18px; color: var(--text-2); font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.profile-chart { width: 100%; height: 86px; display: block; }
.rpe { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.rpe button { padding: 8px 0; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.rpe button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 800; }
textarea, input[type="text"], input[type="number"], input[type="time"], select {
  width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 42px;
}
textarea { min-height: 70px; resize: vertical; }
label.fld { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--text-2); }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.donebar { position: sticky; bottom: calc(-22px - var(--safe-bottom)); margin: 18px -18px calc(-22px - var(--safe-bottom)); padding: 12px 18px calc(14px + var(--safe-bottom)); background: rgba(28, 24, 25, 0.96); border-top: 1px solid var(--line); display: flex; gap: 8px; }

/* Tables & lists */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); font-weight: 650; padding: 8px 6px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 9px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl td.r, .tbl th.r { text-align: right; }
.scroll-x { overflow-x: auto; }
.st { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.st:first-child { border-top: 0; }
.st .sn { font-family: var(--font-display); font-weight: 900; font-size: 26px; color: var(--t-h); line-height: 1; }
.st b { display: block; }
.st .spec { font-size: 13.5px; color: var(--text); }
.st .split { font-size: 13px; color: var(--text-2); margin-top: 2px; }
.share { height: 6px; border-radius: 3px; background: #3a3132; overflow: hidden; margin-top: 7px; }
.share i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.runline { display: flex; align-items: center; gap: 8px; color: var(--text-3); font-size: 12px; padding: 4px 0 4px 46px; }

/* =========================================================
   Pace-Engine (Daniels-VDOT)
   ========================================================= */
const Pace = {
  vdot(dist, sec) {
    const t = sec / 60, v = dist / t;
    const vo2 = -4.6 + 0.182258 * v + 0.000104 * v * v;
    const pct = 0.8 + 0.1894393 * Math.exp(-0.012778 * t) + 0.2989558 * Math.exp(-0.1932605 * t);
    return vo2 / pct;
  },
  vel(vd, f) { const a = 0.000104, b = 0.182258, c = -4.6 - vd * f; return (-b + Math.sqrt(b * b - 4 * a * c)) / (2 * a); },
  spk(vd, f) { return 60000 / this.vel(vd, f); },
  predict(dist, vd) {
    let lo = dist / 400 * 60, hi = dist / 80 * 60;
    for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (this.vdot(dist, m) > vd) lo = m; else hi = m; }
    return (lo + hi) / 2;
  }
};
function paceSource() {
  const tests = (S.profile.tests || []).filter(t => t && t.dist > 0 && t.sec > 0).slice().sort((a, b) => (a.date < b.date ? -1 : 1));
  const src = tests.length ? tests[tests.length - 1] : BASE_RACE;
  return { src, vdot: Pace.vdot(src.dist, src.sec), isBase: !tests.length };
}
function paceTable() {
  const { vdot } = paceSource();
  const r5 = s => Math.round(s / 5) * 5;
  const p = f => Pace.spk(vdot, f);
  const tMid = p(0.88);
  return {
    vdot,
    E: [r5(p(0.72)), r5(p(0.64))], T: [r5(p(0.89)), r5(p(0.87))], K1: [r5(p(0.94)), r5(p(0.92))],
    I: [r5(p(1.0)), r5(p(0.97))], R: [r5(p(1.08)), r5(p(1.05))], RP: [r5(tMid + 10), r5(tMid + 25)],
    P3K: Pace.predict(3000, vdot)
  };
}
const rng = a => (Math.round(a[0]) === Math.round(a[1]) ? mmss(a[0]) : mmss(a[0]) + "–" + mmss(a[1]));
function fillP(text, P) {
  return String(text)
    .replace(/\{(E|T|K1|I|R|RP)\}/g, (_, k) => rng(P[k]) + " /km")
    .replace(/\{I400\}/g, rng(P.I.map(s => s * 0.4)))
    .replace(/\{I800\}/g, rng(P.I.map(s => s * 0.8)))
    .replace(/\{K1000\}/g, rng(P.K1))
    .replace(/\{RP1000\}/g, rng(P.RP))
    .replace(/\{P3K\}/g, mmss(P.P3K));
}
function hrZones() {
  const mx = +S.profile.hrMax, rs = +S.profile.hrRest;
  if (!mx) return null;
  const z = (lo, hi) => (rs ? [Math.round(rs + (mx - rs) * lo), Math.round(rs + (mx - rs) * hi)] : [Math.round(mx * lo), Math.round(mx * hi)]);
  return { z1: z(0.5, 0.6), z2: z(0.6, 0.7), z3: z(0.7, 0.8), z4: z(0.8, 0.9), z5: z(0.9, 1), karvonen: !!rs };
}

const Cloud = {
  db: null, canWrite: null, dirty: {}, inflight: {}, pending: {}, timers: {}, migrated: false, loaded: { p: false, w: false },
  async init() {
    if (STANDALONE || !window.claude || typeof window.claude.use !== "function") { setSync("local"); return; }
    let db = null;
    try { db = await window.claude.use("db"); } catch (e) { db = null; }

      if (this.loaded.p && this.loaded.w) {

      db.doc("profile/main").onSnapshot(snap => {

        });
        if (changed) { saveLocal(); render(); }
        settle();
      }, err => { this.fail(err); });
    } catch (e) { this.fail(e); }
  },
  fail(err) {
    const code = err && err.code;
    if (code === "revoked" || code === "not_granted" || code === "capability_disabled") { this.db = null; setSync("local"); }
    else setSync("offline");
  },
  migrate() {
    if (this.migrated || !this.db || this.canWrite === false) return;
    this.migrated = true;
    const lp = S.profile.updatedAt || "";
    if (lp && (!this.remoteProfile || lp > (this.remoteProfileStamp || ""))) this.write("profile/main", S.profile, true);
    const rs = this.remoteStamp || {};
    Object.keys(S.weeks).forEach(id => { const ls = S.weeks[id].updatedAt || ""; if (!(id in rs) || ls > rs[id]) this.write("weeks/" + id, S.weeks[id], true); });
  },
  async removeAll() {

    const ids = Object.keys(this.remoteStamp || {});

  },
  write(path, data, now) {

  async flush(path) {

    delete this.pending[path];
    this.inflight[path] = true;
    try {
      await this.db.doc(path).set(body);
      if (UI.sync !== "cloud") setSync("cloud");
    } catch (err) {
      const code = err && err.code;
      if (code === "invalid_argument") { this.canWrite = false; setSync("readonly"); toast("Keine Schreibrechte – Daten bleiben auf diesem Gerät"); }

      else setSync("offline");
    } finally {
      this.inflight[path] = false;
      if (this.pending[path]) this.flush(path); else this.dirty[path] = false;
    }
  }
};

function liveScore(c, Wk) {
  const m = +c.time.slice(0, 2) * 60 + +c.time.slice(3, 5), pref = dowOf(c.date) >= 5 ? 615 : 1080;
  return (c.fmt === Wk.h.cls ? 0 : 10) + (c.free >= 6 ? 0 : 3) + Math.abs(m - pref) / 120;
}
function liveSuggest(idx) {
  const Wk = WEEKS[idx];
  if (!Wk || !Wk.h || Wk.race) return null;
  const iso = weekStart(idx);
  if (!liveCovers(iso)) return null;
  const want = [Wk.h.cls, "Signature", "Sprint"].filter((x, i, a) => a.indexOf(x) === i);
  const soon = Date.now() + 36e5;
  const list = liveWeek(iso).filter(c => forTwo(c) && inWindow(c) && want.indexOf(c.fmt) >= 0 && startOf(c) > soon);
  list.sort((a, b) => liveScore(a, Wk) - liveScore(b, Wk) || (a.date + a.time).localeCompare(b.date + b.time));
  return { iso, list, want };
}

/* =========================================================
   Wochenplanung (Platzierung mit Erholungsregeln)
   ========================================================= */
function penalty(arr) {
  const by = Array(7).fill(null);
  arr.forEach(a => { by[a.day] = a; });
  let p = 0;
  for (let d = 0; d < 6; d++) {
    const a = by[d], b = by[d + 1];
    if (a && b) {
      p += 1;
      if (a.int === "hard" && b.int === "hard") p += 8;
      if (a.key === "k" && b.key === "q") p += a.level === "hart" ? 4 : 1;
      if (a.key === "q" && b.key === "k" && b.int === "hard") p += 2;
      if (a.key === "h" && b.key === "q") p += 2;
    }
  }
  for (let d = 0; d < 5; d++) if (by[d] && by[d + 1] && by[d + 2]) p += 4;
  let streak = 0;
  for (let d = 0; d < 7; d++) { if (!by[d]) { streak++; if (streak >= 3) p += 1; } else streak = 0; }
  const z = arr.find(a => a.key === "z2"), q = arr.find(a => a.key === "q");
  if (z && z.day >= 5) p -= 2;
  if (q && q.day >= 5) p += 1;
  if (q && (q.day === 1 || q.day === 2)) p -= 0.5;
  return p;
}
function kRank(c, Wk) {
  const i = Wk.k.rec.indexOf(c.name);
  return (i < 0 ? 2 : i) * 0.6 + (c.time < "16:00" ? 0.8 : 0) + (c.conf === "niedrig" ? 1.0 : 0);
}

function hSpecFor(Wk, ws) {
  const pace = Object.assign({ status: "open" }, ws.pace || {});
  const days = ws.days || {};
  if (pace.status === "booked" && pace.day != null) return { mode: "fixed", day: +pace.day, time: pace.time || slotTime(+pace.day), src: "pace", cls: pace.cls || Wk.h.cls };
  if (pace.status === "skip") return null;
  if (pace.status === "full") {
    const alt = ws.hAlt || "zirkel";
    const c = alt.indexOf("bs-") === 0 ? courseById(alt) : null;
    if (c) return { mode: "fixed", day: c.day, time: c.time, src: "bs", course: c };
    const src = alt === "run" ? "run" : "zirkel";
    return days.h != null ? { mode: "fixed", day: +days.h, src } : { mode: "flex", allowed: [0, 1, 2, 3, 4, 5, 6], src };
  }
  if (pace.day != null) return { mode: "fixed", day: +pace.day, time: pace.time || slotTime(+pace.day), src: "pace-open", cls: pace.cls || Wk.h.cls };
  // Live-Belegung: nur Tage mit echtem freien Kurs (>= 2 Plätze, abends/Wochenende) anbieten
  const sug = liveSuggest(Wk.n - 1);
  if (sug && sug.list.length) {
    const live = {};
    sug.list.forEach(c => { const d = dowOf(c.date); if (!live[d] || liveScore(c, Wk) < liveScore(live[d], Wk)) live[d] = c; });
    return { mode: "flex", allowed: Object.keys(live).map(Number), live, src: "pace-open", cls: Wk.h.cls };
  }
  return { mode: "flex", allowed: [0, 1, 2, 3, 5, 6], src: "pace-open", cls: Wk.h.cls };
}

function search(Wk, ws, useManual) {
  const days = useManual ? (ws.days || {}) : {};
  let kCands;
  if (ws.kId === "skip") kCands = [null];
  else if (ws.kId && courseById(ws.kId)) kCands = [courseById(ws.kId)];
  else { kCands = recCourses(Wk); if (!kCands.length) kCands = [null]; }
  let hSpec = hSpecFor(Wk, ws);
  if (hSpec && hSpec.mode === "fixed" && !useManual && (hSpec.src === "zirkel" || hSpec.src === "run")) hSpec = { mode: "flex", allowed: [0, 1, 2, 3, 4, 5, 6], src: hSpec.src };
  const best = searchWith(Wk, ws, days, kCands, hSpec);
  if (!best && hSpec && hSpec.live && !useManual) return searchWith(Wk, ws, days, kCands, { mode: "flex", allowed: [0, 1, 2, 3, 5, 6], src: "pace-open", cls: Wk.h.cls });
  return best;
}
function searchWith(Wk, ws, days, kCands, hSpec) {
  let best = null;
  kCands.forEach(kc => {
    const fixed = [];
    if (kc) fixed.push({ key: "k", day: kc.day, int: courseLevel(kc), level: kc.level });
    if (hSpec && hSpec.mode === "fixed") fixed.push({ key: "h", day: hSpec.day, int: "hard" });
    const used = new Set(fixed.map(f => f.day));
    if (used.size < fixed.length && kCands.length > 1) return;
    const hDays = hSpec && hSpec.mode === "flex" ? hSpec.allowed : [null];
    const qDays = days.q != null ? [+days.q] : [0, 1, 2, 3, 4, 5, 6];
    const zDays = days.z2 != null ? [+days.z2] : [0, 1, 2, 3, 4, 5, 6];
    hDays.forEach(hd => {
      if (hd != null && used.has(hd)) return;
      qDays.forEach(qd => {
        if (used.has(qd) || qd === hd) return;
        zDays.forEach(zd => {
          if (zd === qd || zd === hd || used.has(zd)) return;
          const arr = fixed.slice();
          if (hd != null) arr.push({ key: "h", day: hd, int: "hard" });
          arr.push({ key: "q", day: qd, int: "hard" });
          arr.push({ key: "z2", day: zd, int: "easy" });
          const lc = hd != null && hSpec && hSpec.live ? hSpec.live[hd] : null;
          const pen = penalty(arr) + (kc && !ws.kId ? kRank(kc, Wk) : 0) + (lc ? (lc.fmt === Wk.h.cls ? 0 : 0.8) + (lc.free < 6 ? 2 : 0) : 0);
          if (!best || pen < best.pen - 1e-9) best = { pen, kc, hd, qd, zd, hSpec };
        });
      });
    });
  });
  return best;
}

function buildWeek(idx) {

  const items = [];

    items.push({ key: "k", type: "k", day: c.day, time: c.time, dur: c.dur, int: courseLevel(c), title: c.name, sub: c.room + (Wk.k.addon ? " + " + ADDONS[Wk.k.addon].title.replace(/\s*\(.*\)/, "") : ""),
      place: LOC.bs, course: c, suggested: !ws.kId, optional: !!Wk.k.optional });
  }
  const hs = best ? best.hSpec : null;
  if (hs) {
    const hDay = hs.mode === "fixed" ? hs.day : best.hd;
    if (hs.src === "pace" || hs.src === "pace-open") {

      const f = PACE_FORMATS[cls] || PACE_FORMATS.Signature;
      const coach = lc && lc.coach ? " · Coach " + lc.coach : "";
      items.push({ key: "h", type: "h", day: hDay, time: hs.time || (lc ? lc.time : slotTime(hDay)), dur: lc ? lc.dur : f.dur, int: "hard",
        title: "Pace Club · " + (cls === "Special" && lc ? lc.name : clsTitle(cls)),
        sub: booked ? "Gebucht über Wellpass" + coach : lc ? "Live " + lc.free + " frei" + coach + " · noch buchen" : "Slot prüfen & buchen (mind. 2 Plätze)",
        place: LOC.pace, src: hs.src, cls, liveId: lc ? lc.id : null, flag: booked ? "ok" : "book", suggested: hs.mode === "flex" });
    } else if (hs.src === "bs") {
      const c = hs.course;
      items.push({ key: "h", type: "h", day: c.day, time: c.time, dur: c.dur, int: "hard", title: c.name, sub: "Ersatz für Pace Club · " + c.room, place: LOC.bs, src: "bs", course: c, flag: "alt" });
    } else {
      const z = hs.src === "run" ? RUN_FALLBACK : ZIRKEL[Wk.h.zirkel];
      items.push({ key: "h", type: "h", day: hDay, time: times.h || "18:30", dur: z.dur, int: "hard", title: z.title, sub: hs.src === "run" ? "Ersatz · draußen" : "Ersatz · im Gym (Body & Soul Functional Area)",
        place: hs.src === "run" ? "" : LOC.bs, src: hs.src, flag: "alt", suggested: !(ws.days && ws.days.h != null) });
    }
  }
  if (best) {
    const q = QLIB[Wk.q];
    items.push({ key: "q", type: "q", day: best.qd, time: times.q || (best.qd >= 5 ? "09:30" : "18:00"), dur: blocksDur(q.blocks), int: "hard",
      title: q.title, cal: "Intervalle " + q.title, sub: q.sub, place: "", suggested: !(ws.days && ws.days.q != null) });
    const zmin = Wk.z2.min + (Wk.z2.strides ? 3 : 0);
    items.push({ key: "z2", type: "z2", day: best.zd, time: times.z2 || (best.zd >= 5 ? "09:30" : "18:30"), dur: zmin, int: "easy",
      title: Wk.z2.min + " min locker", cal: "Zone-2-Lauf " + Wk.z2.min + " min", sub: "locker @ " + rng(P.E) + " /km" + (Wk.z2.strides ? " + " + Wk.z2.strides + " Steigerungen" : ""),
      place: "", suggested: !(ws.days && ws.days.z2 != null) });
  }
  items.sort((a, b) => a.day - b.day || String(a.time).localeCompare(String(b.time)));
  return { idx, iso, Wk, ws, items, checks: weekChecks(items), manualConflict };
}

function weekChecks(items) {
  const by = Array(7).fill(null);
  items.forEach(it => { if (!by[it.day] || it.int === "hard") by[it.day] = it; });
  const out = [];
  for (let d = 0; d < 6; d++) {
    const a = by[d], b = by[d + 1];
    if (a && b && a.int === "hard" && b.int === "hard") out.push({ lvl: "warn", text: DAYS[d] + " & " + DAYS[d + 1] + ": zwei harte Tage hintereinander" });
    if (a && b && a.key === "k" && b.key === "q" && a.course && a.course.level === "hart") out.push({ lvl: "warn", text: "Harter Kraftkurs am Vortag der Intervalle" });
  }
  for (let d = 0; d < 5; d++) if (by[d] && by[d + 1] && by[d + 2]) out.push({ lvl: "warn", text: "3 Trainingstage am Stück (" + DAYS[d] + "–" + DAYS[d + 2] + ")" });
  if (!out.some(o => o.lvl === "warn")) out.push({ lvl: "good", text: "48 h zwischen harten Einheiten" });
  const rest = by.filter(x => !x).length;
  out.push({ lvl: rest >= 3 ? "good" : "warn", text: rest + " Ruhetage" });
  return out;
}

const LOADF = { hard: 1.6, mod: 1.25, easy: 1 };
const weekLoad = b => b.items.filter(i => !i.optional).reduce((s, i) => s + i.dur * LOADF[i.int], 0);

  return { done, total: plan.length };
}

function calTimes(it, idx) {
  const date = dateOf(idx, it.day), start = it.time || "18:00";
  return { date, start, end: timeAdd(start, it.dur || 60) };
}
function appleUrl(ev) {
  const q = new URLSearchParams({ service: "apple", start: ev.date + " " + ev.start, end: ev.date + " " + ev.end, title: ev.title, timezone: "Europe/Berlin", description: ev.desc, location: ev.place || "" });
  return "https://calndr.link/d/event/?" + q.toString();
}
function googleUrl(ev) {
  const ds = ev.date.replace(/-/g, ""), f = x => x.replace(":", "") + "00";
  const q = new URLSearchParams({ action: "TEMPLATE", text: ev.title, dates: ds + "T" + f(ev.start) + "/" + ds + "T" + f(ev.end), ctz: "Europe/Berlin", details: ev.desc, location: ev.place || "" });
  return "https://calendar.google.com/calendar/render?" + q.toString();
}
function itemEvent(it, b) { const t = calTimes(it, b.idx); return { date: t.date, start: t.start, end: t.end, title: calTitle(it), desc: calDesc(it, b), place: it.place || "" }; }

function googleLink(it, b) { return googleUrl(itemEvent(it, b)); }

/* =========================================================
   Charts
   ========================================================= */
function workoutProfile(blocks) {
  const segs = [];
  blocks.forEach(b => {
    const iv = b[4];
    if (iv) {
      for (let r = 0; r < iv.reps; r++) {
        segs.push({ m: iv.on, z: iv.zOn });
        if (r < iv.reps - 1) segs.push({ m: iv.off, z: iv.zOff });
      }
    } else segs.push({ m: b[1], z: b[2] });
  });
  const total = segs.reduce((s, x) => s + x.m, 0) || 1;
  const W = 600, H = 86, base = 70, top = 8;
  let x = 0, rects = "";
  segs.forEach(s => {
    const w = s.m / total * W, zr = Math.max(1, Math.min(5, s.z));
    const h = (base - top) * (zr / 5);
    const col = "var(--z" + Math.round(zr) + ")";
    rects += '<rect x="' + (x + 0.5).toFixed(1) + '" y="' + (base - h).toFixed(1) + '" width="' + Math.max(w - 1, 1).toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2" fill="' + col + '"/>';
    x += w;
  });
  const grid = [1, 2, 3, 4, 5].map(z => { const y = base - (base - top) * z / 5; return '<line x1="0" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="#ffffff" stroke-opacity="0.05"/>'; }).join("");
  return '<svg class="profile-chart" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" role="img" aria-label="Intensitätsprofil der Einheit über ' + Math.round(total) + ' Minuten">' + grid + rects +
    '<line x1="0" x2="' + W + '" y1="' + base + '" y2="' + base + '" stroke="#5a4f50"/>' +
    '<text x="0" y="84" fill="#988c86" font-size="11" font-family="Archivo, sans-serif">0</text>' +
    '<text x="' + W + '" y="84" fill="#988c86" font-size="11" text-anchor="end" font-family="Archivo, sans-serif">' + Math.round(total) + " min</text>" +
    '<text x="' + W + '" y="' + (top + 9) + '" fill="#988c86" font-size="10" text-anchor="end" font-family="Archivo, sans-serif">Z5</text></svg>';
}

function ring(frac, size, stroke, label, sub) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(1, frac)));
  return '<div class="ring-wrap" style="width:' + size + "px;height:" + size + 'px"><svg viewBox="0 0 ' + size + " " + size + '" aria-hidden="true">' +
    '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="#3a3132" stroke-width="' + stroke + '"/>' +
    '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="var(--accent)" stroke-width="' + stroke + '" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '" transform="rotate(-90 ' + size / 2 + " " + size / 2 + ')"/></svg>' +
    '<div class="ring-inner"><b class="num">' + label + "</b><span>" + sub + "</span></div></div>";
}

function loadChart(weeks) {
  const loads = weeks.map(weekLoad);
  const max = Math.max.apply(null, loads) * 1.08;
  const W = 640, H = 190, padL = 34, padB = 26, padT = 10, cw = (W - padL) / weeks.length;
  const cur = curWeek();
  let g = "";
  [100, 200, 300, 400, 500, 600].filter(v => v < max).forEach(v => {
    const y = H - padB - (H - padB - padT) * v / max;
    g += '<line x1="' + padL + '" x2="' + W + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="#fff" stroke-opacity="0.06"/><text x="' + (padL - 6) + '" y="' + (y + 4).toFixed(1) + '" fill="#988c86" font-size="11" text-anchor="end" font-family="Archivo, sans-serif">' + v + "</text>";
  });
  weeks.forEach((b, i) => {
    const v = loads[i], h = (H - padB - padT) * v / max, x = padL + i * cw + cw * 0.18, w = cw * 0.64, y = H - padB - h;
    const Wk = b.Wk;
    const col = Wk.deload ? "var(--t-rec)" : Wk.key ? "var(--t-h)" : Wk.race ? "var(--accent)" : "#8a7e79";
    const pr = weekProgress(b);
    const tip = "W" + Wk.n + " · " + Wk.title + " · " + Math.round(v) + " Belastungspunkte · " + pr.done + "/" + pr.total + " erledigt";
    g += '<g class="lc-bar" data-tip="' + esc(tip) + '" data-action="goto-week" data-idx="' + i + '" style="cursor:pointer">' +
      '<rect x="' + (padL + i * cw).toFixed(1) + '" y="' + padT + '" width="' + cw.toFixed(1) + '" height="' + (H - padB - padT) + '" fill="transparent"/>' +
      '<path d="M' + x.toFixed(1) + " " + (H - padB) + "V" + (y + 4).toFixed(1) + "q0 -4 4 -4h" + (w - 8).toFixed(1) + "q4 0 4 4V" + (H - padB) + 'z" fill="' + col + '"' + (i === cur ? ' stroke="var(--accent)" stroke-width="2"' : "") + "/>" +
      (pr.total && pr.done ? '<rect x="' + x.toFixed(1) + '" y="' + (H - padB + 3) + '" width="' + (w * pr.done / pr.total).toFixed(1) + '" height="3" rx="1.5" fill="var(--good)"/>' : "") +
      '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (H - 6) + '" fill="' + (i === cur ? "#ff8f73" : "#988c86") + '" font-size="11" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="' + (i === cur ? 700 : 400) + '">' + Wk.n + "</text></g>";
  });
  return '<svg viewBox="0 0 ' + W + " " + H + '" style="width:100%;height:auto;display:block" role="img" aria-label="Geplante Belastung pro Woche">' + g + "</svg>";
}

function chipList(checks) {

function renderProfil() {

  const tp = totalProgress(weeks);
  let rpes = [];
  weeks.forEach(b => { Object.keys(b.ws.rpe || {}).forEach(k => { const v = +b.ws.rpe[k]; if (v) rpes.push(v); }); });

  // Streak in Wochen mit allen Pflicht-Einheiten
  let streak = 0;
  for (let i = Math.min(curWeek(), WEEKS.length - 1); i >= 0; i--) { const p = weekProgress(weeks[i]); if (p.total && p.done >= p.total) streak++; else if (i !== curWeek()) break; }

  html += '<div class="stats"><div class="stat"><b>' + tp.done + '</b><span>von ' + tp.total + ' Einheiten</span></div><div class="stat"><b>' + streak + '</b><span>volle Wochen in Folge</span></div><div class="stat"><b>' + avgRpe + '</b><span>Ø Anstrengung (RPE)</span></div></div>';
  // Heatmap

let lastFocus = null;
function openSheet(html) {
  if (!UI.refreshing) lastFocus = document.activeElement;
  $("#sheetPanel").innerHTML = '<div class="grab" aria-hidden="true"></div><button class="sheet-close" data-action="close-sheet" aria-label="Schließen">' + IC.x + "</button>" + html;
  $("#sheet").hidden = false;
  document.body.style.overflow = "hidden";
  if (!UI.refreshing) {
    $("#sheetPanel").scrollTop = 0;
    const c = $("#sheetPanel .sheet-close"); if (c) c.focus({ preventScroll: true });
  }
}
function closeSheet() {
  $("#sheet").hidden = true;
  document.body.style.overflow = "";
  UI.sheet = null;
  if (lastFocus && lastFocus.focus) try { lastFocus.focus({ preventScroll: true }); } catch (e) { /* ok */ }
}
function refreshSheet() {
  if (!UI.sheet || $("#sheet").hidden) return;
  const p = $("#sheetPanel"), st = p.scrollTop;
  UI.refreshing = true;
  try { UI.sheet(); } finally { UI.refreshing = false; }
  p.scrollTop = st;
}

function openImport() {
  UI.sheet = null;
  const html = '<div><div class="sh-type" style="color:var(--accent)">Speichern</div><h2 class="sh-title" id="sheetTitle">Daten wiederherstellen</h2>' +
    '<p class="small muted">Füge hier den Text ein, den du mit „Daten kopieren“ gesichert hast. Deine aktuellen Einträge werden dabei ersetzt.</p>' +
    '<label class="fld" for="impText">Gesicherte Daten<textarea id="impText" rows="6" placeholder="{&quot;profile&quot;: …}"></textarea></label>' +
    '<div class="donebar"><button class="btn primary block" data-action="do-import">' + IC.check + "Wiederherstellen</button></div></div>";

function openCourse(id) {
  UI.sheet = () => openCourse(id);
  const c = courseById(id);
  if (!c) { closeSheet(); return; }
  const idx = UI.week, Wk = WEEKS[idx];
  const html = '<div style="--tc:var(--t-k)"><div class="sh-type">Body & Soul Brunnthal · ' + (c.cat === "hiit" ? "HIIT" : "Kraft") + '</div><h2 class="sh-title" id="sheetTitle">' + esc(c.name) + "</h2>" +
    '<div class="sh-meta"><span class="chip">' + IC.cal + DAYS_LONG[c.day] + '</span><span class="chip">' + IC.clock + esc(c.time) + " · " + c.dur + ' min</span><span class="chip">' + esc(c.room || "–") + "</span></div>" +
    '<div class="sh-sec"><h4>Hyrox-Nutzen</h4><div class="small muted">' + esc(COURSE_INFO[c.name] || "Eigener Kurs.") + "</div>" + (c.note ? '<div class="xs faint">' + esc(c.note) + "</div>" : "") + "</div>" +
    '<div class="sh-sec"><h4>Zeit anpassen</h4><div class="fgrid"><label class="fld" for="ceDay">Tag<select id="ceDay">' + DAYS_LONG.map((d, i) => '<option value="' + i + '"' + (i === c.day ? " selected" : "") + ">" + d + "</option>").join("") + '</select></label><label class="fld" for="ceTime">Uhrzeit<input id="ceTime" type="time" value="' + esc(c.time) + '"></label></div>' +
    '<div class="btns"><button class="btn small" data-action="save-course" data-id="' + esc(c.id) + '">Speichern</button>' + (c.custom ? '<button class="btn small" data-action="del-course" data-id="' + esc(c.id) + '">Löschen</button>' : c.edited ? '<button class="btn small" data-action="reset-course" data-id="' + esc(c.id) + '">Original</button>' : "") + "</div></div>" +
    (c.cat === "kraft" && !Wk.race ? '<div class="donebar"><button class="btn primary block" data-action="pick-course" data-idx="' + idx + '" data-id="' + esc(c.id) + '">Als Kraftkurs für Woche ' + Wk.n + " wählen</button></div>" :
      c.cat === "hiit" && !Wk.race ? '<div class="donebar"><button class="btn block" data-action="pick-alt" data-idx="' + idx + '" data-alt="' + esc(c.id) + '" data-setfull="1">Als Pace-Club-Ersatz für Woche ' + Wk.n + "</button></div>" : "") + "</div>";
  openSheet(html);
}

    '<div class="stack" style="margin-top:12px"><label class="fld" for="ncName">Name<input id="ncName" type="text" placeholder="z. B. HOT IRON® 2"></label>' +

function openSync() {
  UI.sheet = () => openSync();
  const html = '<div><div class="sh-type" style="color:var(--accent)">Speicherstatus</div><h2 class="sh-title" id="sheetTitle">' + esc($("#syncChip span").textContent) + "</h2>" +
    '<p class="small muted">' + esc(syncText()) + "</p>" +
    '<div class="sh-sec"><h4>Gut zu wissen</h4><ul class="tips"><li>Jeden Sonntag gibt es ein Update: neue Coach-Notiz und, falls nötig, angepasste Kurszeiten.</li><li>Die Pace-Club-Belegung aktualisiert sich 5× am Tag automatisch, die Stand-Zeit steht unter Kurse. Vor dem Buchen kurz in Wellpass gegenchecken.</li><li>Abhaken, RPE und Notizen helfen beim Anpassen des Plans.</li><li>Kalendertermine werden einzeln über den Button in jeder Einheit angelegt.</li></ul></div></div>';
  openSheet(html);
}

/* =========================================================
   Toast & Tooltip
   ========================================================= */
let toastT = null;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2200);
}
function showTip(el, ev) {
  const tip = $("#chartTip"), r = el.getBoundingClientRect();
  tip.textContent = el.getAttribute("data-tip");
  tip.hidden = false;
  const x = ev && ev.clientX ? ev.clientX : r.left + r.width / 2;
  tip.style.left = Math.max(90, Math.min(window.innerWidth - 90, x)) + "px";
  tip.style.top = r.top + "px";
}
function hideTip() { $("#chartTip").hidden = true; }

/* =========================================================
   Events
   ========================================================= */
const H = {
  "open-item": el => openItem(+el.dataset.idx, el.dataset.key),
  "close-sheet": () => closeSheet(),
  "goto-week": el => { hideTip(); UI.week = +el.dataset.idx; UI.chipScrolled = false; go("woche"); window.scrollTo({ top: 0 }); },
  "goto-tab": el => {
    closeSheet(); go(el.dataset.tab);
    const a = el.dataset.anchor && document.getElementById(el.dataset.anchor);
    if (a && a.scrollIntoView) a.scrollIntoView({ block: "start" }); else window.scrollTo({ top: 0 });
  },
  "toggle-done": el => {
    const idx = +el.dataset.idx, key = el.dataset.key, iso = weekStart(idx);
    const wasDone = itemDone(S.weeks[iso] || {}, key);
    updateWeek(iso, w => { w.done = w.done || {}; w.done[key] = !wasDone; });
    toast(wasDone ? "Wieder offen" : "Stark! Wie hart war's? RPE antippen");
    refreshSheet();
  },
  "set-rpe": el => { const idx = +el.dataset.idx, key = el.dataset.key; updateWeek(weekStart(idx), w => { w.rpe = w.rpe || {}; w.rpe[key] = +el.dataset.val; }); refreshSheet(); },
  "open-course-picker": el => openCoursePicker(+el.dataset.idx),
  "pick-course": el => {
    const idx = +el.dataset.idx, id = el.dataset.id;
    updateWeek(weekStart(idx), w => { if (id) w.kId = id; else delete w.kId; });
    closeSheet(); toast(id === "skip" ? "Woche ohne Kraftkurs" : id ? "Kurs gewählt, Läufe neu verteilt" : "Automatisch gewählt");
  },
  "pace-status": el => {
    const idx = +el.dataset.idx, st = el.dataset.status;
    if (st === "booked") { openPaceBook(idx); return; }
    updateWeek(weekStart(idx), w => { w.pace = Object.assign({}, w.pace || {}, { status: st }); if (st === "open") { delete w.pace.day; delete w.pace.time; delete w.pace.liveId; } });
  },
  "open-pace-book": el => openPaceBook(+el.dataset.idx),
  "open-live": el => openLiveClass(el.dataset.id),
  "live-book": el => {
    const c = Live.byId[el.dataset.id];
    if (!c) return;
    const idx = weekIndexOf(c.date);
    if (idx < 0 || idx >= WEEKS.length || WEEKS[idx].race) { toast("Liegt außerhalb der Trainingswochen"); return; }
    const day = dowOf(c.date), cls = c.fmt === "Special" ? c.name : c.fmt;
    updateWeek(weekStart(idx), w => {
      w.pace = { status: "booked", day, time: c.time, cls, liveId: c.id };
      if (w.days) ["q", "z2"].forEach(k => { if (w.days[k] === day) delete w.days[k]; });
      if (w.kId && courseById(w.kId) && courseById(w.kId).day === day) delete w.kId;
    });
    closeSheet(); toast("Eingetragen: " + DAYS[day] + " " + c.time + " · Woche " + (idx + 1));
  },
  "live-unbook": el => {
    const c = Live.byId[el.dataset.id];
    if (!c) return;
    updateWeek(weekStart(weekIndexOf(c.date)), w => { w.pace = { status: "open" }; });
    refreshSheet(); toast("Ausgetragen");
  },
  "live-week": el => { UI.liveWeek = el.dataset.iso; UI.liveDay = null; render(); },
  "live-day": el => { UI.liveDay = +el.dataset.day; render(); },
  "live-fmt": el => setLivePrefs(p => { const f = el.dataset.fmt, i = p.off.indexOf(f); if (i >= 0) p.off.splice(i, 1); else p.off.push(f); }),
  "live-evening": () => setLivePrefs(p => { p.evening = !p.evening; }),
  "live-min2": () => setLivePrefs(p => { p.min2 = !p.min2; }),
  "live-refresh": () => Live.refresh(),
  "live-goto": el => { UI.liveWeek = weekStart(+el.dataset.idx); UI.liveDay = null; UI.kurseView = "pace"; try { localStorage.setItem(KV_LS, "pace"); } catch (e) { /* ok */ } closeSheet(); go("kurse"); window.scrollTo({ top: 0 }); },
  "kurse-view": el => { UI.kurseView = el.dataset.v === "bs" ? "bs" : "pace"; try { localStorage.setItem(KV_LS, UI.kurseView); } catch (e) { /* ok */ } render(); window.scrollTo({ top: 0 }); },
  "wp-setup": () => openWpSetup(),
  "wp-enable": () => {
    try { localStorage.setItem(WP_LS, "1"); } catch (e) { /* ok */ }
    setTimeout(() => { closeSheet(); render(); }, 300);
  },
  "wp-reset": () => { try { localStorage.removeItem(WP_LS); } catch (e) { /* ok */ } toast("Kurzbefehl zurückgesetzt"); render(); },
  "copy-class": el => { const c = Live.byId[el.dataset.id]; if (c) copy(liveText(c), "Kursdaten kopiert"); },
  "pb-live-day": el => {
    UI.pbDay = +el.dataset.day;
    const p = $("#sheetPanel"), st = p.scrollTop;
    UI.refreshing = true;
    try { openPaceBook(UI.paceDraft.idx, true); } finally { UI.refreshing = false; }
    p.scrollTop = st;
  },
  "pb-day": el => { UI.paceDraft.day = +el.dataset.day; document.querySelectorAll("#pbDays button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.day === UI.paceDraft.day))); },
  "pb-time": el => { $("#pbTime").value = el.dataset.time; },
  "pb-save": el => {
    const d = UI.paceDraft, idx = +el.dataset.idx;
    const time = ($("#pbTime").value || d.time), cls = $("#pbCls").value;
    updateWeek(weekStart(idx), w => {
      const lc = Live.list.find(c => c.date === dateOf(idx, d.day) && c.time === time);
      w.pace = { status: "booked", day: d.day, time, cls };
      if (lc) w.pace.liveId = lc.id;
      if (w.days) { ["q", "z2"].forEach(k => { if (w.days[k] === d.day) delete w.days[k]; }); }
      if (w.kId && courseById(w.kId) && courseById(w.kId).day === d.day) delete w.kId;
    });
    closeSheet(); toast("Pace Club eingetragen");
  },
  "pick-alt": el => {
    const idx = +el.dataset.idx;
    updateWeek(weekStart(idx), w => { w.hAlt = el.dataset.alt; if (el.dataset.setfull) w.pace = Object.assign({}, w.pace || {}, { status: "full" }); if (w.days) delete w.days.h; });
    if (el.dataset.setfull) { closeSheet(); toast("Als Ersatz eingeplant"); }
  },
  "set-day": el => {
    const idx = +el.dataset.idx, key = el.dataset.key, day = +el.dataset.day;
    updateWeek(weekStart(idx), w => { w.days = w.days || {}; if (w.days[key] === day) delete w.days[key]; else w.days[key] = day; });
  },
  "runs-auto": el => { updateWeek(weekStart(+el.dataset.idx), w => { if (w.days) { delete w.days.q; delete w.days.z2; } }); toast("Läufe automatisch geplant"); },
  "open-course": el => openCourse(el.dataset.id),
  "open-course-form": () => openCourseForm(),
  "add-course": () => {
    const name = ($("#ncName").value || "").trim();
    if (!name) { toast("Bitte einen Namen eintragen"); return; }
    const c = { id: "cu-" + Date.now().toString(36), name, day: +$("#ncDay").value, time: $("#ncTime").value || "18:00", cat: $("#ncCat").value, level: $("#ncLevel").value, room: ($("#ncRoom").value || "").trim(), dur: 60 };
    updateProfile(p => { p.customCourses = (p.customCourses || []).concat([c]); });
    closeSheet(); toast("Kurs hinzugefügt");
  },
  "save-course": el => {
    const id = el.dataset.id, day = +$("#ceDay").value, time = $("#ceTime").value;
    const c = courseById(id);
    updateProfile(p => {
      if (c && c.custom) p.customCourses = (p.customCourses || []).map(x => (x.id === id ? Object.assign({}, x, { day, time }) : x));
      else { p.courseEdits = p.courseEdits || {}; p.courseEdits[id] = { day, time }; }
    });
    toast("Kurszeit gespeichert"); refreshSheet();
  },
  "reset-course": el => { updateProfile(p => { if (p.courseEdits) delete p.courseEdits[el.dataset.id]; }); toast("Original-Zeit"); refreshSheet(); },
  "del-course": el => { updateProfile(p => { p.customCourses = (p.customCourses || []).filter(x => x.id !== el.dataset.id); }); closeSheet(); toast("Kurs gelöscht"); },
  "toggle-check": el => { const id = el.dataset.id; updateProfile(p => { p.checklist = p.checklist || {}; p.checklist[id] = !p.checklist[id]; }); },
  "add-test": () => {
    const raw = ($("#tDate").value || "").trim();
    const m = raw.match(/^(\d{1,2})\.(\d{1,2})\.?(\d{4})?$/);
    let date = todayISO();
    if (m) date = (m[3] || todayISO().slice(0, 4)) + "-" + pad(+m[2]) + "-" + pad(+m[1]);
    const sec = parseDur($("#tTime").value), dist = +$("#tDist").value;
    if (!sec || sec < 300) { toast("Zeit bitte als mm:ss eingeben"); return; }
    updateProfile(p => { p.tests = (p.tests || []).concat([{ date, dist, sec }]); });
    toast("Test gespeichert, Paces aktualisiert");
  },
  "del-test": el => {
    const sorted = (S.profile.tests || []).slice().sort((a, b) => (a.date < b.date ? -1 : 1));
    const t = sorted[+el.dataset.i];
    updateProfile(p => { const i = p.tests.findIndex(x => x.date === t.date && x.sec === t.sec && x.dist === t.dist); if (i >= 0) p.tests.splice(i, 1); });
  },
  "dismiss-onboarding": () => updateProfile(p => { p.onboarded = true; }),
  "open-sync": () => openSync(),
  "copy-event": el => {
    const b = buildWeek(+el.dataset.idx), it = b.items.find(i => i.key === el.dataset.key);
    copy(eventText(it, b), "Termin kopiert");
  },
  "open-import": () => openImport(),
  "do-import": () => {
    let o = null;
    try { o = JSON.parse(($("#impText").value || "").trim()); } catch (e) { o = null; }
    if (!o || typeof o !== "object" || typeof o.profile !== "object" || typeof o.weeks !== "object") { toast("Das sind keine gültigen Plan-Daten"); return; }
    const now = new Date().toISOString();
    S.profile = Object.assign(defaultProfile(), o.profile, { updatedAt: now });
    S.weeks = {};
    Object.keys(o.weeks || {}).forEach(k => { if (/^\d{4}-\d{2}-\d{2}$/.test(k) && o.weeks[k] && typeof o.weeks[k] === "object") S.weeks[k] = Object.assign({}, o.weeks[k], { updatedAt: now }); });
    saveLocal();
    Cloud.write("profile/main", S.profile, true);
    Object.keys(S.weeks).forEach(k => Cloud.write("weeks/" + k, S.weeks[k], true));
    closeSheet(); toast("Daten wiederhergestellt"); render();
  },
  "copy-backup": () => copy(JSON.stringify({ profile: S.profile, weeks: S.weeks }), "Daten kopiert"),
  "reset-all": el => {
    if (el.dataset.confirm !== "1") { el.dataset.confirm = "1"; el.textContent = "Wirklich alles löschen?"; return; }
    S.profile = defaultProfile(); S.profile.updatedAt = new Date().toISOString(); S.weeks = {}; saveLocal();
    Cloud.write("profile/main", S.profile);
    Cloud.removeAll();
    toast("Zurückgesetzt"); render();
  }
};
function copy(text, ok) {
  try {
    navigator.clipboard.writeText(text).then(() => toast(ok), () => toast("Kopieren nicht möglich"));
  } catch (e) { toast("Kopieren nicht möglich"); }
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const fn = H[el.dataset.action];
  if (!fn) return;
  if (el.tagName === "A") { fn(el, e); return; }
  e.preventDefault();
  fn(el, e);
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.field) {
    const f = el.dataset.field;
    let v = el.value.trim();
    if (f === "hrMax" || f === "hrRest") v = v ? Math.max(0, Math.min(230, parseInt(v, 10) || 0)) || null : null;
    updateProfile(p => { p[f] = v; });
    toast("Gespeichert");
  } else if (el.dataset.time) {
    const idx = +el.dataset.idx, key = el.dataset.time;
    if (!el.value) return;
    updateWeek(weekStart(idx), w => { w.times = w.times || {}; w.times[key] = el.value; });
    refreshSheet();
  }
});
let noteT = null;
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.note) {
    clearTimeout(noteT);
    const idx = +el.dataset.idx, key = el.dataset.note, val = el.value;
    noteT = setTimeout(() => {
      const iso = weekStart(idx);
      const w = clone(S.weeks[iso] || {}); w.notes = w.notes || {}; w.notes[key] = val.slice(0, 1000); w.updatedAt = new Date().toISOString();
      S.weeks[iso] = w; saveLocal(); Cloud.write("weeks/" + iso, w);
    }, 600);
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });
document.addEventListener("pointerover", e => { const g = e.target.closest("[data-tip]"); if (g) showTip(g, e); });
document.addEventListener("pointerout", e => { const g = e.target.closest("[data-tip]"); if (g) hideTip(); });
window.addEventListener("scroll", hideTip, { passive: true });

/* =========================================================
   Navigation
   ========================================================= */
const TABS = ["woche", "plan", "kurse", "race", "profil"];
function go(tab) {
  if (!TABS.includes(tab)) tab = "woche";
  UI.tab = tab;
  TABS.forEach(t => {
    $("#view-" + t).classList.toggle("active", t === tab);
    const a = document.querySelector('.tab[data-tab="' + t + '"]');
    if (a) { if (t === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); }
  });
  if (location.hash.slice(1) !== tab) { try { history.replaceState(null, "", "#" + tab); } catch (e) { location.hash = tab; } }
  render();
}
window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (t !== UI.tab) go(t); });
document.querySelectorAll(".tab").forEach(a => a.addEventListener("click", e => { e.preventDefault(); closeSheet(); go(a.dataset.tab); window.scrollTo({ top: 0 }); }));

/* =========================================================
   Start
   ========================================================= */
function setTopbarH() { const t = $(".topbar"); if (t) document.documentElement.style.setProperty("--topbar-h", t.offsetHeight + "px"); }
window.addEventListener("resize", setTopbarH);
if (STANDALONE) {
  document.body.classList.add("standalone");
  Live.fc = true;
}
loadLocal();
Live.boot();
setTopbarH();
go(location.hash.slice(1) || "woche");
Cloud.init();
if (STANDALONE) {
  Live.loadSite(false);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - Live.siteChecked > 10 * 60 * 1000) Live.loadSite(false); });
}
})();
